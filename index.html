<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cancionero</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    .error { color: red; }
    footer { margin-top: 24px; color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Cancionero</h1>
  <div id="messages" role="status" aria-live="polite"></div>
  <ul id="songList"></ul>
  <footer>Generado localmente · Netlify compatible</footer>

  <script>
  (async function() {
    const msg = id => { const el = document.getElementById('messages'); if(el) el.innerText = id; };
    const ul = document.getElementById('songList');
    if(!ul){ console.error('No existe #songList'); return; }

    try {
      msg('Cargando lista...');
      const resp = await fetch('./index.json', {cache:'no-store'});
      if(!resp.ok){
        ul.innerHTML = '<li class="error">No se encontró index.json (status ' + resp.status + ')</li>';
        console.error('fetch index.json status', resp.status);
        return;
      }
      const data = await resp.json();
      if(!Array.isArray(data)){
        ul.innerHTML = '<li class="error">index.json debe ser un array</li>';
        console.error('index.json no es array', data);
        return;
      }
      if(data.length === 0){
        ul.innerHTML = '<li>No hay canciones en index.json</li>';
        msg('');
        return;
      }
      ul.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        const slug = (item.slug || '').trim();
        const title = item.title || 'Sin título';
        if(!slug){
          li.textContent = title + ' (slug faltante)';
        } else {
          const a = document.createElement('a');
          a.href = 'canciones/' + encodeURIComponent(slug) + '.html';
          a.textContent = title;
          li.appendChild(a);
        }
        ul.appendChild(li);
      });
      msg('');
    } catch(err){
      ul.innerHTML = '<li class="error">Error cargando lista. Mira la consola</li>';
      console.error('Error general cargando index.json', err);
      msg('');
    }
  })();
  </script>
</body>
</html>
